apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-ops-init
  labels:
    app: git-ops-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git-ops-init
  template:
    metadata:
      labels:
        app: git-ops-init
    spec:
      containers:
        - name: git-ops-init
          image: sw360cab/git-ops-init:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_VERSION
              value: "0.2.0"
