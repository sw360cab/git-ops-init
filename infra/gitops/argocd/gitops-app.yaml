apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-init-argocd
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: canary=sw360cab/git-ops-init
    argocd-image-updater.argoproj.io/canary.update-strategy: semver
    # only the canary Deployment's placeholder image is targeted; the stable
    # Deployment's pinned image is untouched by Image Updater
    argocd-image-updater.argoproj.io/canary.kustomize.image-name: git-ops-init-canary-image
    # write-back-method omitted - defaults to "argocd" (cluster only)
spec:
  project: default
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/sw360cab/git-ops-init.git
    path: infra/kustomize/overlays/test
    targetRevision: master
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true 